<html lang="en">

    <title>KITSERUKI | D-VSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html { 
            margin: 0; padding: 0; background: #010101; color: #ffffff; 
            font-family: 'Inter', sans-serif; overflow: hidden; cursor: none; 
            user-select: none; width: 100vw; height: 100vh;
        }

        .noise {
            position: fixed; inset: 0; z-index: 9998; pointer-events: none;
            opacity: 0.04; mix-blend-mode: overlay;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 96px; height: 96px;
            pointer-events: none; z-index: 9999; will-change: transform;
        }
        
        #canvas { position: fixed; inset: 0; z-index: 0; }
        
        /* Base UI System */
        .ui { 
            position: absolute; inset: 0; display: grid; grid-template-columns: 320px 1fr 320px; 
            padding: 4rem; pointer-events: none; z-index: 1; perspective: 1200px; 
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        /* UI Transition States */
        .ui.transition-warp { transform: scale(1.8) translateZ(300px); opacity: 0; filter: blur(10px); }
        .ui.transition-drop { transform: translateY(120vh) rotateX(-60deg) scale(0.8); opacity: 0; }
        .ui.transition-lift { transform: translateY(-120vh) rotateX(30deg) scale(0.8); opacity: 0; }

        .panel { 
            pointer-events: auto; background: rgba(5, 5, 5, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.03); padding: 3rem; 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; flex-direction: column; transform-style: preserve-3d; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
            will-change: transform;
        }
        
        h1 { 
            font-size: 1.1rem; letter-spacing: 0.3rem; font-weight: 600; margin: 0; 
            text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.3);
            white-space: nowrap; display: flex; align-items: center; /* Forces single line alignment */
        }

        .nav-container { margin-top: 4rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .nav-item { 
            padding: 1.2rem; border: 1px solid rgba(255,255,255,0.05);
            cursor: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            transform-style: preserve-3d; font-size: 0.85rem; letter-spacing: 0.15rem;
            color: rgba(255,255,255,0.6); position: relative; overflow: hidden;
            background: rgba(255,255,255,0.01);
            text-transform: uppercase;
        }

        .nav-item::after { content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 0%; background: #fff; transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .nav-item:hover::after { width: 100%; }
